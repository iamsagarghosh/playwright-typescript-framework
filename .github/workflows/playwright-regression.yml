name: Playwright regression
run-name: >-
  ${{ github.event_name == 'schedule' && 'Scheduled regression' || 'Manual regression' }} /
  ${{ inputs.suite || 'Regression + E2E' }} /
  ${{ inputs.browser || 'Chromium + Microsoft Edge' }}
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Select the test suite to execute
        type: choice
        required: true
        default: Regression + E2E
        options:
          - Smoke
          - Sanity
          - Regression
          - End-to-end
          - Regression + E2E
          - All suites
      browser:
        description: Select the browser project(s) to execute
        type: choice
        required: true
        default: Chromium + Microsoft Edge
        options:
          - Chromium
          - Microsoft Edge
          - Chromium + Microsoft Edge
permissions:
  contents: read
concurrency:
  group: playwright-regression-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    name: Selected Playwright suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      TEST_ENV: local
      TEST_WORKERS: '2'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      TEST_SUITE: ${{ inputs.suite || 'Regression + E2E' }}
      TEST_BROWSER: ${{ inputs.browser || 'Chromium + Microsoft Edge' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Playwright Chromium, Edge, and Linux dependencies
        run: npx playwright install --with-deps chromium msedge
      - name: Show selected test run
        run: |
          echo "Test suite: $TEST_SUITE"
          echo "Browser project(s): $TEST_BROWSER"
          echo "Target environment: $TEST_ENV"
          echo "Parallel workers: $TEST_WORKERS"
      - name: Run selected suite and browser projects
        shell: bash
        run: |
          case "$TEST_SUITE" in
            Smoke) suite_args=(--grep '@smoke') ;;
            Sanity) suite_args=(--grep '@sanity') ;;
            Regression) suite_args=(--grep '@regression') ;;
            End-to-end) suite_args=(--grep '@e2e') ;;
            'Regression + E2E') suite_args=(--grep '@regression|@e2e') ;;
            'All suites') suite_args=() ;;
            *) echo "Unsupported suite: $TEST_SUITE"; exit 1 ;;
          esac

          case "$TEST_BROWSER" in
            Chromium) project_args=(--project=Chromium) ;;
            'Microsoft Edge') project_args=(--project="Microsoft Edge") ;;
            'Chromium + Microsoft Edge') project_args=() ;;
            *) echo "Unsupported browser selection: $TEST_BROWSER"; exit 1 ;;
          esac

          npm test -- "${suite_args[@]}" "${project_args[@]}" --workers="$TEST_WORKERS"
      - name: Upload Playwright report and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        id: upload-report
        with:
          name: playwright-regression-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish test summary
        if: always()
        env:
          PLAYWRIGHT_ARTIFACT_URL: ${{ steps.upload-report.outputs.artifact-url }}
          PLAYWRIGHT_JOB_STATUS: ${{ job.status }}
        run: node scripts/github-summary.cjs
