name: Playwright PR validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: playwright-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Quality checks and Chromium smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      TEST_ENV: local
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Check Prettier formatting
        run: npm run format:check
      - name: Check strict TypeScript compilation
        run: npm run typecheck
      - name: Install Playwright Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Run Chromium smoke tests
        run: npm run test:smoke -- --project=chromium --workers=2
      - name: Upload Playwright report and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-pr-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
