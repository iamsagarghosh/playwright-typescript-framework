name: Playwright PR validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: playwright-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Quality checks and Chromium smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      TEST_ENV: local
      TEST_SUITE: Smoke
      TEST_BROWSER: Chromium
      TEST_WORKERS: '2'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Check Prettier formatting
        run: npm run format:check
      - name: Check strict TypeScript compilation
        run: npm run typecheck
      - name: Install Playwright Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Show selected test run
        run: |
          echo "Test suite: $TEST_SUITE"
          echo "Browser project(s): $TEST_BROWSER"
          echo "Target environment: $TEST_ENV"
          echo "Parallel workers: $TEST_WORKERS"
      - name: Run Chromium smoke suite
        run: npm run test:smoke -- --project=Chromium --workers=2
      - name: Upload Playwright report and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        id: upload-report
        with:
          name: playwright-pr-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish test summary
        if: always()
        env:
          PLAYWRIGHT_ARTIFACT_URL: ${{ steps.upload-report.outputs.artifact-url }}
          PLAYWRIGHT_JOB_STATUS: ${{ job.status }}
        run: node scripts/github-summary.cjs
